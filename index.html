<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Strzały na bramkę</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#091a24;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}#game{width:min(733px,100vw,100dvh);height:min(733px,100vw,100dvh);position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}button{cursor:pointer;border:1px solid #ffffff35;color:white;background:#102d3e;font-weight:700;border-radius:10px;padding:11px 16px;font-size:14px}button:hover{background:#245369}button:focus-visible{outline:3px solid #ffcc58}#controls{position:absolute;right:3%;top:3%;display:flex;gap:7px}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#04131ba8;backdrop-filter:blur(4px)}.panel{width:83%;max-width:480px;padding:32px;background:#102b3df5;border:1px solid #5b8b9a;border-radius:22px;box-shadow:0 20px 60px #0008;text-align:center}.label{font-size:12px;letter-spacing:3px;color:#7ff1bd;font-weight:bold}h1{font-size:38px;margin:16px 0}p{line-height:1.6;color:#c8dce3}.primary{background:#ffcc58;color:#172a2c;border:0;padding:15px 30px;font-size:16px}.hidden{display:none!important}@media(max-width:500px){.panel{padding:18px}h1{font-size:27px}p{font-size:13px}button{font-size:11px;padding:8px}}
</style></head><body><main id="game"><canvas id="pitch" width="733" height="733" aria-label="Boisko piłkarskie. Przeciągnij od piłki w dół i puść, aby strzelić."></canvas><div id="controls"><button id="pause">Pauza</button><button id="reset">Od nowa</button></div><section id="overlay"><div class="panel"><div class="label">PIŁKA NOŻNA • WIDOK Z GÓRY</div><h1 id="title">Strzały na bramkę</h1><p id="info">10 strzałów. Ruchomy bramkarz. Jeden cel.<br>Strzel co najmniej <b>6 goli</b> i zdobądź puchar!<br><br>Przeciągnij od piłki w dół i puść.<br>Długość i kierunek naciągu ustalają strzał.<br>Klawiatura: ← → cel, przytrzymaj spację i puść.</p><button class="primary" id="start">Rozpocznij mecz →</button></div></section></main><script>
'use strict';
const canvas=document.getElementById('pitch'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const CFG={width:733,height:733,shots:10,win:6,ballX:366.5,ballY:552,goalLeft:216,goalRight:517,goalY:122};
let state='menu',goals=0,shots=0,phase='aim',ball,keeperX=366,clock=0,angle=0,power=.64,drag=null,held=false,charge=0,result='',delay=0,last=0,trail=[],best=0;
try{best=Number(localStorage.getItem('football_shots_best'))||0}catch(e){}
function resetBall(){ball={x:CFG.ballX,y:CFG.ballY,vx:0,vy:0};phase='aim';trail=[];angle=0;power=.64;held=false;drag=null;result='';}
function newGame(){goals=0;shots=0;clock=0;resetBall();state='play';overlay.classList.add('hidden');document.getElementById('pause').textContent='Pauza';}
function panel(title,info,label){document.getElementById('title').textContent=title;document.getElementById('info').innerHTML=info;document.getElementById('start').textContent=label;overlay.classList.remove('hidden');}
function pause(){if(state==='play'){state='pause';held=false;drag=null;panel('Przerwa w meczu','Złap oddech. Twoja seria czeka.','Wróć do gry →');document.getElementById('pause').textContent='Wznów'}else if(state==='pause'){state='play';overlay.classList.add('hidden');document.getElementById('pause').textContent='Pauza'}}
document.getElementById('start').onclick=()=>state==='pause'?pause():newGame();document.getElementById('pause').onclick=pause;document.getElementById('reset').onclick=newGame;
function shoot(){if(state!=='play'||phase!=='aim')return;held=false;drag=null;const speed=410+power*620;ball.vx=Math.sin(angle)*speed;ball.vy=-Math.cos(angle)*speed;phase='flight';shots++;}
function finish(g,msg){if(phase!=='flight')return;phase='result';result=msg;if(g)goals++;delay=1.35;}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*733/r.width,y:(e.clientY-r.top)*733/r.height}}
canvas.addEventListener('pointerdown',e=>{if(state!=='play'||phase!=='aim')return;let p=point(e);if(Math.hypot(p.x-ball.x,p.y-ball.y)>82)return;canvas.setPointerCapture(e.pointerId);drag=p;e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);let dx=drag.x-p.x,dy=Math.max(25,p.y-drag.y);angle=Math.max(-.64,Math.min(.64,Math.atan2(dx,dy)));power=Math.max(.12,Math.min(1,Math.hypot(dx,dy)/140))});
canvas.addEventListener('pointerup',()=>{if(drag)shoot()});canvas.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Escape'||e.code==='KeyP'){if(!e.repeat)pause();return}if(state!=='play'||phase!=='aim')return;if(e.code==='ArrowLeft')angle=Math.max(-.64,angle-.045);if(e.code==='ArrowRight')angle=Math.min(.64,angle+.045);if(e.code==='Space'&&!held){held=true;charge=0}});
window.addEventListener('keyup',e=>{if(e.code==='Space'&&held)shoot()});window.addEventListener('blur',()=>{if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});
function box(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function txt(t,x,y,size=16,color='#fff',align='left'){ctx.font=`700 ${size}px Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(t,x,y)}
function player(x,y,color,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(4,7,24,16,0,0,7);ctx.fill();box(-15,5,12,22,5,'#142635');box(3,5,12,22,5,'#142635');box(-27,-9,54,17,7,color);box(-17,-16,34,32,10,color);ctx.fillStyle='#f1b887';ctx.beginPath();ctx.arc(0,-4,12,0,7);ctx.fill();ctx.fillStyle='#282a32';ctx.beginPath();ctx.arc(0,-7,10,Math.PI,Math.PI*2);ctx.fill();ctx.restore()}
function drawBall(x,y){ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(x+3,y+5,12,8,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.fillStyle='#152c3c';ctx.beginPath();for(let k=0;k<5;k++){let a=k*1.256-1.57;ctx.lineTo(x+4.5*Math.cos(a),y+4.5*Math.sin(a))}ctx.closePath();ctx.fill();for(let k=0;k<5;k++){let a=k*1.256;ctx.beginPath();ctx.arc(x+8*Math.cos(a),y+8*Math.sin(a),2.3,0,7);ctx.fill()}}
function draw(){ctx.clearRect(0,0,733,733);ctx.fillStyle='#0c2432';ctx.fillRect(0,0,733,733);txt('MATCHDAY',24,29,12,'#77efb9');txt('STRZAŁY NA BRAMKĘ',24,57,21);box(24,78,685,577,20,'#143e39');
ctx.save();ctx.beginPath();ctx.roundRect(35,88,663,557,14);ctx.clip();for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#20724d':'#247d53';ctx.fillRect(35,88+i*56,663,56)}ctx.strokeStyle='#d4efc58c';ctx.lineWidth=2.5;ctx.strokeRect(63,123,607,508);ctx.strokeRect(170,123,393,226);ctx.strokeRect(263,123,207,89);ctx.beginPath();ctx.arc(366.5,349,89,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(366.5,552,72,Math.PI,0);ctx.stroke();ctx.beginPath();ctx.arc(366.5,285,4,0,7);ctx.fillStyle='#d4efc5';ctx.fill();ctx.restore();
box(210,87,313,39,3,'#d7e9df');box(218,90,297,31,0,'#0e3033');ctx.strokeStyle='#9ac2b767';ctx.lineWidth=1;for(let x=220;x<517;x+=13){ctx.beginPath();ctx.moveTo(x,90);ctx.lineTo(x,122);ctx.stroke()}for(let y=92;y<122;y+=9){ctx.beginPath();ctx.moveTo(218,y);ctx.lineTo(515,y);ctx.stroke()}ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(213,125);ctx.lineTo(213,88);ctx.lineTo(520,88);ctx.lineTo(520,125);ctx.stroke();
player(keeperX,166,'#ffcc58',1.05);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(keeperX-29,165,6,0,7);ctx.arc(keeperX+29,165,6,0,7);ctx.fill();
if(shots>=4){player(292+Math.sin(clock*1.2)*57,324,'#ff775d',.85);player(449+Math.sin(clock*1.2)*57,324,'#ff775d',.85)}
player(366.5,590,'#68b7ff',1.05);
if(phase==='aim'){ctx.save();ctx.strokeStyle='#fff9';ctx.setLineDash([6,11]);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+Math.sin(angle)*180,ball.y-Math.cos(angle)*180);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#ffdb72';ctx.beginPath();ctx.arc(ball.x,ball.y,23,0,7);ctx.stroke();if(drag){ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x-Math.sin(angle)*power*125,ball.y+Math.cos(angle)*power*125);ctx.stroke()}ctx.restore()}
trail.forEach((p,i)=>{ctx.globalAlpha=i/trail.length*.4;drawBall(p.x,p.y)});ctx.globalAlpha=1;drawBall(ball.x,ball.y);
box(46,369,103,62,12,'#0a2b35dc');txt('GÓLY',62,391,11,'#8ae1b0');txt(String(goals).padStart(2,'0'),62,419,27);txt('/ 6',103,419,15,'#c2d9dc');box(582,369,103,62,12,'#0a2b35dc');txt('STRZAŁY',598,391,11,'#a8c4d0');txt(String(shots).padStart(2,'0'),598,419,27);txt('/ 10',639,419,14,'#c2d9dc');
box(236,613,261,25,12,'#0c3037');box(241,618,251*power,15,8,power>.85?'#ffab59':'#7be9b4');txt('SIŁA',218,631,10,'#e2eee0','right');
if(result){box(174,451,385,56,14,'#0b2739ed');txt(result,366.5,486,25,result==='GOOOL!'?'#8af1b5':'#ffcf7b','center')}
txt('PRZECIĄGNIJ OD PIŁKI W DÓŁ I PUŚĆ',366.5,683,16,'#edf6ed','center');txt('← → celowanie   •   spacja: siła i strzał   •   P: pauza',366.5,709,12,'#99b5c2','center');txt('REKORD '+best,655,627,10,'#d2edd6','right');}
function update(dt){if(state!=='play')return;clock+=dt;const oldK=keeperX;keeperX=366.5+Math.sin(clock*(1.3+shots*.09))*119;if(held){charge+=dt;power=.15+.85*Math.min(1,charge/1.15)}if(phase==='flight'){const ox=ball.x,oy=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;trail.push({x:ball.x,y:ball.y});if(trail.length>10)trail.shift();
if(shots>=5&&oy>=324&&ball.y<=324){let t=(oy-324)/(oy-ball.y);if(t>=0&&t<=1){const x=ox+(ball.x-ox)*t;for(const d of [292,449])if(Math.abs(x-(d+Math.sin(clock*1.2)*57))<30)finish(false,'BLOK OBROŃCY')}}
if(phase==='flight'&&oy>=166&&ball.y<=166){let t=(oy-166)/(oy-ball.y),x=ox+(ball.x-ox)*t,k=oldK+(keeperX-oldK)*t;if(Math.abs(x-k)<46)finish(false,'OBRONA!')}
if(phase==='flight'&&ball.y<=CFG.goalY){const t=(oy-CFG.goalY)/(oy-ball.y),x=ox+(ball.x-ox)*t;ball.x=x;ball.y=CFG.goalY;finish(x>226&&x<507,x>226&&x<507?'GOOOL!':'NIECELNY!')}
if(phase==='flight'&&(ball.x<40||ball.x>693))finish(false,'NIECELNY!');
}else if(phase==='result'){delay-=dt;if(delay<=0){if(shots>=CFG.shots){state='end';if(goals>best){best=goals;try{localStorage.setItem('football_shots_best',best)}catch(e){}}panel(goals>=CFG.win?'Puchar jest Twój!':'Rewanż czeka!',`Wynik: <b>${goals} / 10 goli</b>.<br>${goals>=CFG.win?'Świetna skuteczność! Spróbuj zdobyć komplet.':'Do pucharu potrzeba 6 goli. Celuj obok bramkarza.'}<br>Rekord: ${best} goli.`,'Zagraj ponownie →')}else resetBall()}}}
function frame(t){const dt=Math.min(.025,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}resetBall();requestAnimationFrame(frame);
</script></body></html>
